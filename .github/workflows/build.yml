name: Build aoi_native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: android, arch: arm64, os: ubuntu-22.04 }
          - { platform: android, arch: arm32, os: ubuntu-22.04 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04 }
          - { platform: windows, arch: x86_64, os: windows-latest }
        target-type: [template_debug, template_release]
        float-precision: [single]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: .scons-cache/
          key: scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}-

      - name: Build GDExtension
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          if [ "${{ matrix.target.platform }}" = "android" ]; then
            scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} ANDROID_STL=c++_static
          else
            scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}
          fi

      - name: Clean Windows compilation files
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: |
          Remove-Item project/bin/windows/*.exp -Force -ErrorAction SilentlyContinue
          Remove-Item project/bin/windows/*.lib -Force -ErrorAction SilentlyContinue
          Remove-Item project/bin/windows/*.pdb -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoi-native-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: project/bin/**

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: aoi-native-complete
          pattern: aoi-native-*
          delete-merged: true 
